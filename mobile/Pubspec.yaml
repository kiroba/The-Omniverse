name: kickback
description: "The KickBack — Sovereign, Serverless P2P Social Ecosystem"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  camera: ^0.10.5+9
  video_player: ^2.8.2
  google_fonts: ^6.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.2
  crypto: ^3.0.3
  pointycastle: ^3.7.3
  device_info_plus: ^9.1.1
  web_socket_channel: ^2.4.1
  connectivity_plus: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/kickback_app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F172A"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/config/
