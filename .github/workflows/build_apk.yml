name: Build Omniverse Standalone APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Organize Repository & Generate Standalone App
        run: |
          python3 organize_project.py || true
          python3 build_core_engines_standalone_app-v4.py || python3 build_core_engines_standalone_app.py || python3 scripts/build_core_engines_standalone_app-v4.py

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🦋 Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 🧹 Clean Pre-build Cache
        run: |
          cd omni_core_engines_standalone/mobile
          flutter clean

      - name: 📦 Install Flutter Dependencies
        run: |
          cd omni_core_engines_standalone/mobile
          flutter pub get

      - name: 🔨 Build Release APK
        run: |
          cd omni_core_engines_standalone/mobile
          flutter build apk --release --target-platform android-arm64

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omniverse-core-engines-release-apk
          path: omni_core_engines_standalone/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
