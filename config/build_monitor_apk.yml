name: Build Omni Mobile Mesh Monitor APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ⚙️ Generate Standalone Mobile Mesh Monitor App
        run: |
          python3 build_mobile_mesh_monitor_app.py || python3 build_mobile_mesh_monitor_app_v2.py || python3 tools/build_mobile_mesh_monitor_app.py

      - name: ☕ Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🦋 Set up Flutter SDK
        uses: actions/setup-flutter@v3
        with:
          channel: 'stable'

      - name: 🧹 Clean Cache & Install Flutter Dependencies
        run: |
          cd omni_mobile_mesh_monitor_app/mobile
          flutter clean
          flutter pub get

      - name: 🔨 Build Release APK
        run: |
          cd omni_mobile_mesh_monitor_app/mobile
          flutter build apk --release --target-platform android-arm64

      - name: 📤 Upload Monitor APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omni-mobile-mesh-monitor-release-apk
          path: omni_mobile_mesh_monitor_app/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
