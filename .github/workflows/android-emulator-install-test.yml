name: Android emulator install test

# Boots an Android emulator on a free GitHub runner, installs an APK (Mesh Monitor by
# default), launches it and reports the exact adb install / launch result.
# Runners are x86_64, so an arm64-only APK installs only if the system image has ARM
# translation; the job records ro.product.cpu.abilist so that is visible either way.

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: APK to test
        required: true
        default: https://github.com/kiroba/The-Omniverse/releases/download/v0.1.3/mesh-monitor-android-arm64.apk
      package:
        description: Package name (blank = read from the APK)
        required: false
        default: ''
  pull_request:
    paths:
      - .github/workflows/android-emulator-install-test.yml
      - scripts/ci/emulator_install_test.sh

permissions:
  contents: read

concurrency:
  group: emu-install-${{ github.ref }}
  cancel-in-progress: true

env:
  DEFAULT_APK_URL: https://github.com/kiroba/The-Omniverse/releases/download/v0.1.3/mesh-monitor-android-arm64.apk
  DEFAULT_APK_SIZE: '17526775'
  DEFAULT_APK_SHA256: 762edf433873388e7cf243ce2e6d393c5c6b4fe14c6ede97801bb7632b8b6448
  DEFAULT_PACKAGE: com.omniverse.mesh_monitor

jobs:
  install-test:
    name: API ${{ matrix.api-level }} ${{ matrix.target }} x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            target: google_apis
          - api-level: 34
            target: google_apis
    env:
      APK_URL: ${{ inputs.apk_url || 'https://github.com/kiroba/The-Omniverse/releases/download/v0.1.3/mesh-monitor-android-arm64.apk' }}
      PKG_INPUT: ${{ inputs.package || '' }}
      OUT_DIR: emu-out
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download and verify APK
        run: |
          mkdir -p "$OUT_DIR"
          curl -fsSL --retry 3 -o app.apk "$APK_URL"
          SIZE=$(stat -c %s app.apk)
          SHA=$(sha256sum app.apk | cut -d' ' -f1)
          echo "url=$APK_URL size=$SIZE sha256=$SHA" | tee "$OUT_DIR/apk-download.txt"
          if [ "$APK_URL" = "$DEFAULT_APK_URL" ]; then
            if [ "$SIZE" != "$DEFAULT_APK_SIZE" ] || [ "$SHA" != "$DEFAULT_APK_SHA256" ]; then
              echo "::error::Default APK does not match expected size/sha256 ($DEFAULT_APK_SIZE / $DEFAULT_APK_SHA256)"
              exit 1
            fi
            echo "Default APK matches expected size and sha256."
          else
            echo "::warning::Custom APK URL, size/sha256 not checked against a known value."
          fi
          echo "APK_PATH=$PWD/app.apk" >> "$GITHUB_ENV"

      - name: Badging and signature (informational)
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          echo "build-tools: $BT"
          "$BT/aapt2" dump badging app.apk > "$OUT_DIR/badging.txt" 2>&1 || true
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code|launchable-activity|application:)" "$OUT_DIR/badging.txt" || cat "$OUT_DIR/badging.txt"
          "$BT/apksigner" verify --verbose --print-certs app.apk > "$OUT_DIR/apksigner.txt" 2>&1 || true
          cat "$OUT_DIR/apksigner.txt"
          unzip -l app.apk | grep -E 'lib/|AndroidManifest' || true

      - name: Resolve package name
        run: |
          PKG="$PKG_INPUT"
          if [ -z "$PKG" ] && [ -s "$OUT_DIR/badging.txt" ]; then
            PKG=$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" "$OUT_DIR/badging.txt" | head -n1)
          fi
          [ -z "$PKG" ] && PKG="$DEFAULT_PACKAGE"
          echo "Package: $PKG"
          echo "PKG=$PKG" >> "$GITHUB_ENV"

      - name: Boot emulator, install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          emulator-boot-timeout: 900
          script: bash scripts/ci/emulator_install_test.sh

      - name: Write summary
        if: always()
        run: |
          {
            echo "### API ${{ matrix.api-level }} ${{ matrix.target }} x86_64"
            echo ""
            echo "APK: \`$APK_URL\`  package: \`${PKG:-?}\`"
            echo ""
            if [ -f "$OUT_DIR/result.env" ]; then
              set -a; . "$OUT_DIR/result.env"; set +a
              echo "| check | result |"
              echo "|---|---|"
              echo "| ABI list | \`$ABILIST\` |"
              echo "| arm64 translation | $ARM64_TRANSLATION |"
              echo "| install | $INSTALL_OK |"
              echo "| adb install output | \`$INSTALL_LINE\` |"
              echo "| in pm list | $LISTED |"
              echo "| launched (monkey) | $LAUNCHED |"
              echo "| alive after ~12s | $ALIVE ${PID:+(pid $PID)} |"
              if [ -s "$OUT_DIR/logcat-notable.txt" ]; then
                echo ""
                echo "<details><summary>Notable logcat lines</summary>"
                echo ""
                echo '```'
                cat "$OUT_DIR/logcat-notable.txt"
                echo '```'
                echo "</details>"
              fi
            else
              echo "No result file: the emulator step did not finish (boot failure or earlier step failed)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-install-api${{ matrix.api-level }}-${{ matrix.target }}
          path: emu-out/
          if-no-files-found: warn

      - name: Fail if install failed
        if: always()
        run: |
          [ -f "$OUT_DIR/result.env" ] || { echo "::error::No result recorded"; exit 1; }
          . "$OUT_DIR/result.env"
          if [ "$INSTALL_OK" != yes ]; then
            echo "::error::adb install failed on API ${{ matrix.api-level }}: $INSTALL_LINE"
            exit 1
          fi
          [ "$ALIVE" = yes ] || echo "::warning::Installed but the app was not alive ~12s after launch"
