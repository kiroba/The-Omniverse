name: Deploy The Omniverse GitHub Pages Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Website Asset Directory
        run: |
          mkdir -p docs/downloads
          cp -f omni_core_engines_standalone/mobile/build/app/outputs/flutter-apk/app-release.apk docs/downloads/ 2>/dev/null || true
          cp -f omniverse_interactive_gui_builder.py docs/downloads/ 2>/dev/null || true
          cp -f vscode_copilot_omniverse_master_instructions.md docs/downloads/ 2>/dev/null || true
          cp -f kickback_complete_architecture_and_feature_spec.md docs/downloads/ 2>/dev/null || true
          cp -f omni_source_directory.md docs/downloads/ 2>/dev/null || true

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
