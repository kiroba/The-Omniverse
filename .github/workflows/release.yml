name: Publish Release (APKs + Windows)

# Push a tag like v0.9.0 (or run manually) to build every app and publish
# a GitHub Release. Releases are free hosting for binaries on public repos,
# and the Pages site picks up new downloads automatically.
#
# Each app is built from its own repo (kiroba/<repo>, branch `main` unless the
# run names another ref), not generated from mobile/lib. This repo only holds the
# release: one tag, one signing key, one update manifest, stable download links.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.0)"
        required: true
      app_ref:
        description: "Branch, tag or commit to build in every app repo"
        required: false
        default: main

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Release APKs are signed with the PRIVATE release key from repo secrets (see the
  # android job). The committed signing/omniverse-test.p12 is only for CI/test builds
  # (build_apk.yml and the install-test workflows), never for GitHub Releases.
  OMNI_VERSION_CODE: ${{ github.run_number }}
  APP_REF: ${{ github.event.inputs.app_ref || 'main' }}

jobs:
  android:
    name: Android · ${{ matrix.slug }}
    runs-on: ubuntu-latest
    env:
      # Private release signing key (repo secrets). The keystore itself is decoded to
      # $RUNNER_TEMP by the "Release signing key" step, which sets OMNI_KEYSTORE.
      OMNI_KEYSTORE_PASSWORD: ${{ secrets.OMNI_RELEASE_KEYSTORE_PASSWORD }}
      OMNI_KEY_ALIAS: ${{ secrets.OMNI_RELEASE_KEY_ALIAS }}
      OMNI_KEY_PASSWORD: ${{ secrets.OMNI_RELEASE_KEY_PASSWORD }}
      # Gradle throws instead of falling back to the debug key if the keystore is missing.
      OMNI_REQUIRE_RELEASE_KEY: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # slug = asset name, unchanged so download links and installed apps keep working.
          - { repo: The-Omni-Hub,  slug: omniverse-superapp }
          - { repo: KickBack,      slug: kickback-social }
          - { repo: Idle-Plaza,    slug: idle-plaza }
          - { repo: Mesh-Monitor,  slug: mesh-monitor }
          - { repo: Phaser-Studio, slug: phaser-studio }
    steps:
      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: kiroba/${{ matrix.repo }}
          ref: ${{ env.APP_REF }}
          path: app
      - name: Record source commit
        run: |
          echo "- ${{ matrix.slug }} from kiroba/${{ matrix.repo }}@$(git -C app rev-parse --short HEAD)" > "${{ matrix.slug }}.source"
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - uses: actions/setup-java@v4
        with: { java-version: "17", distribution: temurin }
      - name: Release signing key (fails the release if the secrets are missing)
        env:
          OMNI_RELEASE_KEYSTORE_B64: ${{ secrets.OMNI_RELEASE_KEYSTORE_B64 }}
        run: |
          missing=0
          for v in OMNI_RELEASE_KEYSTORE_B64 OMNI_KEYSTORE_PASSWORD OMNI_KEY_ALIAS OMNI_KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Release signing secret for $v is empty or not set"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Add OMNI_RELEASE_KEYSTORE_B64, OMNI_RELEASE_KEYSTORE_PASSWORD, OMNI_RELEASE_KEY_ALIAS and OMNI_RELEASE_KEY_PASSWORD in Settings > Secrets and variables > Actions. Not signing a release with the debug or test key."
            exit 1
          fi
          # Pasted secrets often pick up line breaks, spaces or quotes: strip them.
          clean() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]"'"'"']*//' -e 's/[[:space:]"'"'"']*$//'; }
          for v in OMNI_KEYSTORE_PASSWORD OMNI_KEY_ALIAS OMNI_KEY_PASSWORD; do
            val="$(clean "${!v}")"
            echo "::add-mask::$val"
            printf -v "$v" '%s' "$val"; export "$v"
            echo "$v=$val" >> "$GITHUB_ENV"
          done
          KS="$RUNNER_TEMP/omniverse-release.p12"
          # Keep only the base64 runs (40+ chars each), so a label or note pasted
          # along with the key, or line wrapping, doesn't break decoding.
          B64="$(python3 -c '
          import os, re
          t = re.findall(r"[A-Za-z0-9+/]+={0,2}", os.environ["OMNI_RELEASE_KEYSTORE_B64"])
          idx = [i for i, x in enumerate(t) if len(x) >= 40]
          if not idx:
              print(""); raise SystemExit
          import base64
          def complete(c):  # PKCS12 is DER: 0x30 0x82 + 2-byte length
              try:
                  d = base64.b64decode(c, validate=True)
              except Exception:
                  return False
              return len(d) > 4 and d[0] == 0x30 and d[1] == 0x82 and len(d) == 4 + int.from_bytes(d[2:4], "big")
          core = "".join(t[idx[0]:idx[-1] + 1])
          if not complete(core) and idx[-1] + 1 < len(t):
              core += t[idx[-1] + 1]  # short last line of a wrapped value
          print(core)
          ')"
          if ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
            echo "::error::OMNI_RELEASE_KEYSTORE_B64 is not valid base64 (length after cleanup: ${#B64}). Re-paste the one-line value from the backup file."
            exit 1
          fi
          echo "Decoded release keystore: $(stat -c %s "$KS") bytes"
          # Prove the keystore opens with the stored password and holds the alias.
          keytool -list -storetype pkcs12 -keystore "$KS" -storepass:env OMNI_KEYSTORE_PASSWORD -alias "$OMNI_KEY_ALIAS" > /dev/null \
            || { echo "::error::Release keystore did not open with OMNI_RELEASE_KEYSTORE_PASSWORD / OMNI_RELEASE_KEY_ALIAS"; exit 1; }
          echo "OMNI_KEYSTORE=$KS" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: OTA public key (pins signed update manifests when the secret exists)
        env:
          OMNI_OTA_SIGNING_KEY: ${{ secrets.OMNI_OTA_SIGNING_KEY }}
        run: |
          if [ -n "$OMNI_OTA_SIGNING_KEY" ]; then
            pip install --quiet cryptography
            PUB=$(python3 -c "import os;from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey as K;from cryptography.hazmat.primitives import serialization as s;k=K.from_private_bytes(bytes.fromhex(os.environ['OMNI_OTA_SIGNING_KEY'].strip()));print(k.public_key().public_bytes(s.Encoding.Raw,s.PublicFormat.Raw).hex())")
            echo "OMNI_OTA_PUBKEY=$PUB" >> "$GITHUB_ENV"
            echo "OTA manifests will be signature-pinned to $PUB"
          else
            echo "OMNI_OTA_PUBKEY=" >> "$GITHUB_ENV"
            echo "::warning::OMNI_OTA_SIGNING_KEY not set: update manifests are unsigned (HTTPS + SHA-256 only)"
          fi
      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --android-skip-build-dependency-validation \
            --dart-define=OMNI_APP=${{ matrix.slug }} --dart-define=OMNI_BUILD=$((1000 + ${{ github.run_number }})) \
            --dart-define=OMNI_OTA_PUBKEY=$OMNI_OTA_PUBKEY --dart-define=OMNI_APP_VERSION=${GITHUB_REF_NAME#v}
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/${{ matrix.slug }}-android-arm64.apk"
      - name: Check the APK is signed with the release key
        run: |
          APK="${{ matrix.slug }}-android-arm64.apk"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKSIGNER=$(ls -d "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner not found; skipping signer check (Gradle already refuses to build without the release keystore)"
            exit 0
          fi
          CERT=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERT" | grep -E "certificate DN|SHA-256 digest" || true
          if echo "$CERT" | grep -qiE "Android Debug|The Omniverse Test"; then
            echo "::error::$APK is signed with the debug/test key, not the release key"; exit 1
          fi
          echo "$CERT" | grep -q "CN=The Omniverse Release" || { echo "::error::$APK is not signed with the release certificate"; exit 1; }
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/omniverse-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}
          path: |
            ${{ matrix.slug }}-android-arm64.apk
            ${{ matrix.slug }}.source
          retention-days: 3

  windows:
    name: Windows · ${{ matrix.slug }}
    runs-on: windows-latest
    # No continue-on-error: releases are immutable, so a missing Windows zip must
    # fail the run (rerun the failed job) instead of publishing an incomplete release.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Superapp: unchanged asset name (omniverse-windows-x64.zip).
          # project = the app repo's pubspec name.
          - { repo: The-Omni-Hub, project: omniverse_superapp, slug: omniverse-superapp, zip: omniverse-windows-x64.zip, title: The Omni-Hub }
          # KickBack desktop: talks to the daemon on this PC (127.0.0.1) or a remote one over Tailscale.
          - { repo: KickBack,     project: kickback,           slug: kickback-social,    zip: kickback-social-windows-x64.zip, title: The KickBack }
    steps:
      - name: Check out ${{ matrix.repo }}
        uses: actions/checkout@v4
        with:
          repository: kiroba/${{ matrix.repo }}
          ref: ${{ env.APP_REF }}
          path: app
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Build Windows
        # App repos only carry Android; add a Windows runner at build time.
        working-directory: app
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name ${{ matrix.project }} .
          (Get-Content windows\runner\main.cpp) -replace 'L"${{ matrix.project }}"', 'L"${{ matrix.title }}"' | Set-Content windows\runner\main.cpp
          # local_auth_windows compiles with /await (experimental coroutines), a hard error (STL1011) on
          # MSVC 14.5x / VS 2026 runners. Silence it for every plugin target until upstream moves to C++20 <coroutine>.
          $cm = Get-Content windows\CMakeLists.txt -Raw
          $cm = $cm -replace '(project\([^)]*\)\r?\n)', "`$1add_compile_definitions(_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS)`n"
          Set-Content windows\CMakeLists.txt $cm
          if (-not (Select-String -Path windows\CMakeLists.txt -Pattern '_SILENCE_EXPERIMENTAL_COROUTINE' -Quiet)) { throw "could not patch windows/CMakeLists.txt" }
          flutter pub get
          $build = 1000 + ${{ github.run_number }}
          flutter build windows --release "--dart-define=OMNI_APP=${{ matrix.slug }}-windows" "--dart-define=OMNI_BUILD=$build"
          if ($LASTEXITCODE -ne 0) { throw "flutter build windows failed ($LASTEXITCODE)" }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "$env:GITHUB_WORKSPACE\${{ matrix.zip }}"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.slug }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: [android, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: List binaries
        run: ls -la dist
      - name: Release notes (which app commit each APK came from)
        run: |
          { echo "Built from the app repos:"; cat dist/*.source; } > notes.md
          rm -f dist/*.source
          cat notes.md
      - name: Check every asset is present (releases are immutable)
        run: |
          missing=0
          for f in omniverse-superapp kickback-social idle-plaza mesh-monitor phaser-studio; do
            [ -s "dist/$f-android-arm64.apk" ] || { echo "::error::missing $f-android-arm64.apk"; missing=1; }
          done
          for f in omniverse-windows-x64.zip kickback-social-windows-x64.zip; do
            [ -s "dist/$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            echo "::error::Not publishing an incomplete release. Re-run the failed jobs."
            exit 1
          fi
      - name: Write OTA update manifest
        env:
          OMNI_OTA_SIGNING_KEY: ${{ secrets.OMNI_OTA_SIGNING_KEY }}
        # Apps read releases/latest/download/update-manifest.json to self-update.
        # When OmniNet's mesh transport is live, peers serve this same manifest first.
        run: |
          pip install --quiet cryptography
          python3 - <<'PY'
          import hashlib, json, os, glob
          tag = os.environ["TAG"]
          build = 1000 + int(os.environ["GITHUB_RUN_NUMBER"])
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          apps = {}
          for apk in sorted(glob.glob("dist/*-android-arm64.apk")):
              name = os.path.basename(apk)
              slug = name[: -len("-android-arm64.apk")]
              sha = hashlib.sha256(open(apk, "rb").read()).hexdigest()
              apps[slug] = {"url": f"{base}/{name}", "sha256": sha}
          manifest = {"tag": tag, "build": build, "transport": "github", "apps": apps}
          key_hex = os.environ.get("OMNI_OTA_SIGNING_KEY", "").strip()
          if key_hex:
              from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
              key = Ed25519PrivateKey.from_private_bytes(bytes.fromhex(key_hex))
              canon = json.dumps(manifest, sort_keys=True, separators=(",", ":")).encode()
              manifest["signature"] = key.sign(canon).hex()
          json.dump(manifest, open("dist/update-manifest.json", "w"), indent=2)
          print(json.dumps(manifest, indent=2))
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: The Omniverse ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: dist/*
